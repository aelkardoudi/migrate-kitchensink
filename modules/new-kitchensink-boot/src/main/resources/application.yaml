spring:
  application:
    name: new-kitchensink-boot
  mongodb:
    uri: ${SPRING_MONGODB_URI}

kitchensink:
  mongodb:
    migration-uri: ${KS_MONGODB_MIGRATION_URI}

server:
  servlet:
    context-path: /kitchensink

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,mongo

---
spring:
  config:
    activate:
      on-cloud-platform: kubernetes

logging:
  level:
    org.springframework.web.servlet.DispatcherServlet: DEBUG
