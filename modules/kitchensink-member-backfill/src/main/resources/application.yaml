spring:
  application:
    name: kitchensink-member-backfill
  main:
    web-application-type: none
  datasource:
    url: ${KS_BATCH_JDBC_URL}
    username: sa
    hikari:
      maximum-pool-size: 2
  batch:
    jdbc:
      initialize-schema: always
  mongodb:
    uri: ${KS_MONGODB_URI}

kitchensink:
  backfill:
    chunk-size: ${KS_BACKFILL_CHUNK_SIZE:100}
    source:
      jdbc-url: ${KS_H2_JDBC_URL}
      username: ${KS_H2_USER:members_backfill}
      password: ${KS_H2_PASSWORD}
      read-only: true
      maximum-pool-size: 2
