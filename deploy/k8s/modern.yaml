apiVersion: apps/v1
kind: Deployment
metadata:
  name: modern
  labels: {app: modern}
  annotations: {kitchensink.io/member-store: mongodb}
spec:
  replicas: 1
  selector:
    matchLabels: {app: modern}
  template:
    metadata:
      labels: {app: modern}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: modern
          image: IMAGE_MODERN
          imagePullPolicy: Never
          env:
            - name: MONGO_MEMBER_API_PASSWORD
              valueFrom:
                secretKeyRef: {name: mongodb-member-api-credentials, key: MONGO_MEMBER_API_PASSWORD}
            - name: SPRING_MONGODB_URI
              value: mongodb://members_api:$(MONGO_MEMBER_API_PASSWORD)@mongodb:27017/kitchensink?authSource=kitchensink&w=majority&journal=true
            - name: MONGO_MIGRATION_PASSWORD
              valueFrom:
                secretKeyRef: {name: mongodb-migration-credentials, key: MONGO_MIGRATION_PASSWORD}
            - name: KS_MONGODB_MIGRATION_URI
              value: mongodb://members_migrator:$(MONGO_MIGRATION_PASSWORD)@mongodb:27017/kitchensink?authSource=kitchensink&w=majority&journal=true
            - {name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=50.0"}
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /kitchensink/actuator/health/readiness, port: http}
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /kitchensink/actuator/health/readiness, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /kitchensink/actuator/health/liveness, port: http}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: modern
  labels: {app: modern}
spec:
  selector: {app: modern}
  ports: [{name: http, port: 8080, targetPort: http}]
