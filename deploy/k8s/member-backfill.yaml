apiVersion: batch/v1
kind: Job
metadata:
  generateName: member-backfill-
  labels:
    app: member-backfill
    backfill-run-id: "BACKFILL_RUN_ID"
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: member-backfill
        backfill-run-id: "BACKFILL_RUN_ID"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: member-backfill
          image: IMAGE_MEMBER_BACKFILL
          imagePullPolicy: Never
          args:
            - "run.id=BACKFILL_RUN_ID"
            # BACKFILL_MAX_MEMBER_ID
          env:
            - {name: KS_H2_JDBC_URL, value: "jdbc:h2:tcp://h2:9092/kitchensink"}
            - {name: KS_H2_USER, value: members_backfill}
            - name: KS_H2_PASSWORD
              valueFrom:
                secretKeyRef: {name: h2-backfill-credentials, key: H2_BACKFILL_PASSWORD}
            - {name: KS_BATCH_JDBC_URL, value: "jdbc:h2:file:/data/batch-metadata"}
            - name: MONGO_RELAY_PASSWORD
              valueFrom:
                secretKeyRef: {name: mongodb-credentials, key: MONGO_RELAY_PASSWORD}
            - name: KS_MONGODB_URI
              value: "mongodb://members_relay:$(MONGO_RELAY_PASSWORD)@mongodb:27017/kitchensink?authSource=kitchensink"
            - {name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=50.0"}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: member-backfill-data}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
