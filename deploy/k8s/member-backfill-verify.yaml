apiVersion: batch/v1
kind: Job
metadata:
  generateName: member-backfill-verify-
  labels: {app: member-backfill-verify}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: {app: member-backfill-verify}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: member-backfill-verify
          image: IMAGE_MEMBER_BACKFILL
          imagePullPolicy: Never
          args: [verify]
          env:
            - {name: KS_H2_JDBC_URL, value: "jdbc:h2:tcp://h2:9092/kitchensink"}
            - {name: KS_H2_USER, value: members_backfill}
            - name: KS_H2_PASSWORD
              valueFrom:
                secretKeyRef: {name: h2-backfill-credentials, key: H2_BACKFILL_PASSWORD}
            - name: MONGO_RELAY_PASSWORD
              valueFrom:
                secretKeyRef: {name: mongodb-credentials, key: MONGO_RELAY_PASSWORD}
            - name: KS_MONGODB_URI
              value: "mongodb://members_relay:$(MONGO_RELAY_PASSWORD)@mongodb:27017/kitchensink?authSource=kitchensink"
            - {name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=50.0"}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
